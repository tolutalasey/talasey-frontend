name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, types, format, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  components:
    name: Components in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run storybook:build
      - run: npm run test:stories

  e2e:
    name: End-to-end and Lighthouse against the backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: talasey
          POSTGRES_PASSWORD: talasey
          POSTGRES_DB: api
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U talasey" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      BACKEND_DIR: backend
      DATABASE_URL: postgres://talasey:talasey@localhost:5432/api
      REDIS_URL: redis://localhost:6379
      REVALIDATE_SECRET: ci-only-revalidate-secret-that-is-long-enough
    steps:
      - uses: actions/checkout@v5
      - name: Check out the backend next to the site
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.BACKEND_REPO || 'tolutalasey/talasey-backend' }}
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          path: backend
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - name: Lighthouse on every template (mobile)
        env:
          APP_ENV: production
          SITE_URL: http://localhost:3000
          API_URL: http://localhost:4000
        run: |
          npm run build
          (cd backend && npm run start &)
          npm run lighthouse
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report
            .lighthouseci
          retention-days: 7
